<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>
    {% if editar %}Editar exercício{% else %}Adicionar exercício{% endif %} - Respira Aí
  </title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">
      {% if editar %}Editar exercício{% else %}Adicionar exercício{% endif %}
    </h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-warning">
          {% for msg in messages %}
            {{ msg }}  

          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% if editar %}
      <form method="post"
            action="{{ url_for('editar_exercicio', id=exercicio.id_exercicio) }}">
    {% else %}
      <form method="post" action="{{ url_for('adicionar_exercicio') }}">
    {% endif %}

      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input
          id="nome"
          type="text"
          name="nome"
          class="form-control"
          maxlength="100"
          value="{{ nome if nome is defined else (exercicio.nome if exercicio else '') }}"
          required
        >
      </div>

      <div class="mb-3">
        <label for="duracao" class="form-label">Duração (minutos)</label>
        <input
          id="duracao"
          type="number"
          name="duracao"
          class="form-control"
          min="1"
          step="1"
          value="{{ duracao if duracao is defined else (exercicio.duracao if exercicio else '') }}"
          required
        >
      </div>

      <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <textarea
          id="descricao"
          name="descricao"
          class="form-control"
          rows="4"
          maxlength="1000"
          required
        >{{ descricao if descricao is defined else (exercicio.descricao if exercicio else '') }}</textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-warning">
          {% if editar %}Salvar alterações{% else %}Adicionar exercício{% endif %}
        </button>

        <a href="{{ url_for('lista_exercicios') }}"
           class="btn btn-outline-secondary">
          Voltar
        </a>
      </div>
    </form>
  </div>
</body>
</html>
