<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro do administrador - RespiraAi</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >
</head>
<body class="bg-warning d-flex align-items-center justify-content-center vh-100">
  <div class="login-container bg-white p-5 rounded-4 shadow text-center"
       style="max-width: 400px; width: 100%;">
    <h1 class="h2 fw-bold mb-4">Cadastrar administrador</h1>

    <form method="POST" action="{{ url_for('cadastro_administrador') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <input
          type="text"
          name="nome"
          class="form-control"
          placeholder="Nome completo"
          maxlength="50"
          required
        >
      </div>

      <div class="mb-3">
        <input
          type="email"
          name="email"
          class="form-control"
          placeholder="E-mail"
          required
        >
      </div>

      <div class="mb-3">
        <input
          type="password"
          name="senha"
          class="form-control"
          placeholder="Senha"
          required
        >
      </div>

      <button type="submit" class="btn btn-dark w-100">Cadastrar</button>
    </form>

    {% if erro %}
      <p class="text-danger mt-3" role="alert">{{ erro }}</p>
    {% endif %}

    <p class="mt-3 mb-0">
      <a href="{{ url_for('login_administrador') }}"class="btn btn-warning mt-3">Voltar ao login do administrador
      </a>
    </p>
  </div>
</body>
</html>
